name: VK bridge import and syntax checks
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install VK frontend dependencies
        run: python -m pip install -r vk_bot/requirements.txt
      - name: Import VK frontend and shared backend
        run: python -c "import vk_bot.main; import vk_bot.backend; import agent_actions"
      - name: Validate syntax and VK security checks
        run: |
          python -m py_compile bot.py vk_bot/main.py vk_bot/backend.py
          python -m unittest discover -s tests -p 'test_vk_security_static.py'
