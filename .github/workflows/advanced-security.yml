name: Advanced security checks
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '15 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependency-and-code-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python syntax and regression tests
        run: |
          python -m compileall -q bot.py tests
          python -m unittest discover -s tests -p 'test_*.py'
      - name: Install Python security scanners
        run: python -m pip install --upgrade pip pip-audit bandit
      - name: Dependency vulnerability scan
        run: python -m pip_audit -r requirements.txt
      - name: Static high-severity Python scan
        run: python -m bandit -q -r bot.py --severity-level high --confidence-level high
  secret-scanning:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check repository and history for exposed credentials
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
