name: Security regression checks
on:
  pull_request:
  workflow_dispatch:
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static bot security checks
        run: python -m unittest discover -s tests -p 'test_security_*.py'
