name: Render Keep Alive (HTTP)

on:
  # Render Free becomes idle after 15 minutes without inbound HTTP traffic.
  # Offset from minute 0: GitHub's cron scheduling is busiest there.
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keep_alive:
    name: Check public Render health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wake service / verify HTTP 200
        env:
          HEALTH_URL: https://fraction-praise-bot-1.onrender.com/health
        run: |
          set -euo pipefail
          echo "Checking Render HTTP health endpoint..."
          curl             --fail             --silent             --show-error             --location             --connect-timeout 15             --max-time 100             --retry 2             --retry-delay 5             --retry-all-errors             --output /dev/null             --write-out "Render returned HTTP %{http_code}\n"             "$HEALTH_URL"
